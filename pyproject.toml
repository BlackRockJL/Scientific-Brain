[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "scientific-brain"
version = "0.1.0"
description = "A lean second brain for research and scientific computing, modelled on human memory"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "BlackRockJL" }]
dependencies = []
keywords = ["second-brain", "knowledge-base", "research", "notes", "memory", "claude-code", "sqlite-fts5"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Topic :: Text Processing :: Indexing",
]

[project.urls]
Homepage = "https://github.com/BlackRockJL/Scientific-Brain"

[project.scripts]
sb = "scientific_brain.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scientific_brain = ["RULES.md"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
